[project]
name = "crypto-recon-lakehouse"
version = "0.1.0"
description = "Crypto market data lakehouse: stream vs batch reconciliation with self-healing gaps"
requires-python = "==3.12.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/common",
    "producer",
    "fetchers",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# PySpark convention: `from pyspark.sql import functions as F`
"databricks/**" = ["N812"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["crypto_recon_*"]
