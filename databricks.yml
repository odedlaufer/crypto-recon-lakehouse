bundle:
  name: crypto-recon-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target

workspace:
  host: https://dbc-c6f5458b-d402.cloud.databricks.com

targets:
  dev:
    # No `mode: development`: it prefixes UC schemas with dev_<user>_,
    # which is redundant with one catalog per environment (ADR-006).
    default: true
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
    variables:
      catalog: crypto_dev

  prd:
    mode: production
    workspace:
      root_path: /Workspace/Users/odedlaufer1@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: crypto_prd
