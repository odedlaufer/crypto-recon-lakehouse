version: 2

models:
  - name: gaps
    description: >-
      One row per gap in trade ids per product (FR-J2, ADR-002, ADR-013). Status is
      re-evaluated on every run: open until every missing trade id is present in
      silver.trades, then repaired. (unrepairable is added with backfill, Phase 3.)
    config:
      contract:
        enforced: true
    columns:
      - name: gap_id
        data_type: string
        description: md5 of product_id, from_trade_id and to_trade_id.
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: product_id
        data_type: string
        description: Coinbase product, e.g. BTC-USD.
        constraints:
          - type: not_null
      - name: from_trade_id
        data_type: bigint
        description: First missing trade id.
      - name: to_trade_id
        data_type: bigint
        description: Last missing trade id.
      - name: missing_count
        data_type: bigint
        description: to_trade_id - from_trade_id + 1.
      - name: gap_start_time
        data_type: timestamp
        description: Exchange time of the last trade before the gap.
      - name: gap_end_time
        data_type: timestamp
        description: Exchange time of the first trade after the gap.
      - name: detected_at
        data_type: timestamp
        description: When the gap was first detected.
      - name: present_count
        data_type: bigint
        description: How many of the missing ids are now in silver.trades.
      - name: status
        data_type: string
        description: open or repaired.
        data_tests:
          - accepted_values:
              arguments:
                values: [open, repaired]
      - name: repaired_at
        data_type: timestamp
        description: When the gap was first seen fully repaired.
      - name: last_checked_at
        data_type: timestamp
        description: When the gap was last evaluated.
