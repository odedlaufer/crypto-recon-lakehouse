version: 2

sources:
  - name: silver
    description: Parsed, typed, deduplicated entities built by the stream pipeline and batch jobs.
    schema: silver
    tables:
      - name: trades
        description: One row per Coinbase trade from the stream.
        config:
          loaded_at_field: exchange_time
          freshness:  # FR-D4, DQ-10
            warn_after: {count: 30, period: minute}
            error_after: {count: 2, period: hour}
        data_tests:  # FR-O5, DQ-19: warn only; edr monitor sends anomalies to Slack
          - elementary.dimension_anomalies:  # trades per product per day
              arguments:
                timestamp_column: exchange_time
                time_bucket: {period: day, count: 1}
                dimensions: [product_id]
              config:
                severity: warn
      - name: trades_backfill
        description: Trades fetched from REST to repair gaps (ADR-014).
      - name: candles_official
        description: Official Coinbase 1-minute candles, published by the write-audit-publish job.
        config:
          loaded_at_field: _published_at
          freshness:  # FR-D4
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}

  - name: bronze
    description: Raw ingested records.
    schema: bronze
    tables:
      - name: backfill_attempts
        description: One row per gap per backfill run (requested, received, missing).

  - name: gold
    description: Stream-built aggregates from the stream pipeline.
    schema: gold
    tables:
      - name: candles_stream_1m
        description: 1-minute candles built from silver.trades (ADR-009).

  - name: system_lakeflow
    description: Databricks system tables for jobs (FR-O1).
    database: system
    schema: lakeflow
    tables:
      - name: job_run_timeline
        description: One row per job run period (start, end, result).
      - name: jobs
        description: Job definitions over time (SCD); latest name per job_id.
