version: 2

unit_tests:
  - name: reconciliation_status_classifier
    description: >-
      FR-R3 statuses, the FR-R5 volume tolerance boundary (0.01%), and ADR-012:
      a disagreement on a provably complete stream minute is OFFICIAL_MISMATCH.
      BTC-USD minutes are never provably complete (trade-id gaps around them);
      SOL-USD minutes 00:01 to 00:03 are.
    model: int_reconciliation_1m
    given:
      - input: ref('stg_candles_stream')
        rows:
          # BTC-USD: gaps at ids 11, 22, 33 keep these minutes unprovable.
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:00:00", open: 100, high: 110, low: 90, close: 105, volume: 10.000, trade_count: 5, first_trade_id: 1, last_trade_id: 5}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:01:00", open: 100, high: 110, low: 90, close: 105, volume: 10.001, trade_count: 5, first_trade_id: 6, last_trade_id: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:02:00", open: 100, high: 110, low: 90, close: 105, volume: 10.002, trade_count: 5, first_trade_id: 12, last_trade_id: 16}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:03:00", open: 100, high: 110, low: 90, close: 105, volume: 9.998, trade_count: 5, first_trade_id: 17, last_trade_id: 21}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:04:00", open: 100, high: 110, low: 90, close: 106, volume: 10.000, trade_count: 5, first_trade_id: 23, last_trade_id: 27}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:05:00", open: 100, high: 111, low: 90, close: 105, volume: 12.000, trade_count: 5, first_trade_id: 28, last_trade_id: 32}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:07:00", open: 100, high: 110, low: 90, close: 105, volume: 10.000, trade_count: 5, first_trade_id: 34, last_trade_id: 38}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:08:00", open: 100, high: 110, low: 90, close: 105, volume: 10.000, trade_count: 5, first_trade_id: 39, last_trade_id: 43}
          # SOL-USD: ids 100 to 129 contiguous, except an internal gap at 00:04 (4 trades over 5 ids).
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:00:00", open: 100, high: 110, low: 90, close: 105, volume: 10, trade_count: 5, first_trade_id: 100, last_trade_id: 104}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:01:00", open: 100, high: 110, low: 90, close: 105, volume: 10, trade_count: 5, first_trade_id: 105, last_trade_id: 109}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:02:00", open: 100, high: 110, low: 90, close: 105, volume: 10, trade_count: 5, first_trade_id: 110, last_trade_id: 114}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:03:00", open: 100, high: 110, low: 90, close: 105, volume: 12, trade_count: 5, first_trade_id: 115, last_trade_id: 119}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:04:00", open: 100, high: 110, low: 90, close: 105, volume: 10, trade_count: 4, first_trade_id: 120, last_trade_id: 124}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:05:00", open: 100, high: 110, low: 90, close: 105, volume: 10, trade_count: 5, first_trade_id: 125, last_trade_id: 129}
      - input: ref('stg_candles_official')
        rows:
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:00:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:01:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:02:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:03:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:04:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:05:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: BTC-USD, minute_ts: "2026-11-10 00:06:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: ETH-USD, minute_ts: "2026-11-10 00:08:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:00:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:01:00", open: 100, high: 110, low: 90, close: 104, volume: 10}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:03:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:04:00", open: 100, high: 110, low: 90, close: 104, volume: 10}
          - {product_id: SOL-USD, minute_ts: "2026-11-10 00:05:00", open: 100, high: 110, low: 90, close: 105, volume: 10}
    expect:
      rows:
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:00:00", status: MATCH}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:01:00", status: MATCH}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:02:00", status: VOLUME_DRIFT}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:03:00", status: VOLUME_DRIFT}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:04:00", status: PRICE_MISMATCH}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:05:00", status: PRICE_MISMATCH}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:06:00", status: MISSING_IN_STREAM}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:07:00", status: MISSING_IN_BATCH}
        - {product_id: BTC-USD, minute_ts: "2026-11-10 00:08:00", status: MISSING_IN_BATCH}
        - {product_id: ETH-USD, minute_ts: "2026-11-10 00:08:00", status: MISSING_IN_STREAM}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:00:00", status: MATCH}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:01:00", status: OFFICIAL_MISMATCH}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:02:00", status: OFFICIAL_MISMATCH}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:03:00", status: OFFICIAL_MISMATCH}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:04:00", status: PRICE_MISMATCH}
        - {product_id: SOL-USD, minute_ts: "2026-11-10 00:05:00", status: MATCH}
