version: 2

models:
  - name: fct_reconciliation_1m
    description: >-
      One row per reconciled product-minute (FR-R1 to FR-R4). Only minutes past the
      settlement window and within published official days. status_before_repair is the
      status at first reconciliation; status_after_repair is the latest.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, minute_ts]
      - elementary.dimension_anomalies:  # FR-O5: shifts in the status mix
          arguments:
            timestamp_column: minute_ts
            dimensions: [status_before_repair]
            time_bucket: {period: day, count: 1}
          config:
            severity: warn
    columns:
      - name: product_id
        data_type: string
        description: Coinbase product, e.g. BTC-USD.
        constraints:
          - type: not_null
      - name: minute_ts
        data_type: timestamp
        description: Start of the 1-minute bucket (UTC).
        constraints:
          - type: not_null
      - name: status_before_repair
        data_type: string
        description: Status when the minute was first reconciled (raw completeness).
        data_tests:
          - accepted_values:
              arguments:
                values: [MATCH, OFFICIAL_MISMATCH, VOLUME_DRIFT, PRICE_MISMATCH, MISSING_IN_STREAM, MISSING_IN_BATCH]
      - name: status_after_repair
        data_type: string
        description: Latest status (repaired completeness).
        data_tests:
          - accepted_values:
              arguments:
                values: [MATCH, OFFICIAL_MISMATCH, VOLUME_DRIFT, PRICE_MISMATCH, MISSING_IN_STREAM, MISSING_IN_BATCH]
      - name: open_delta
        data_type: decimal(38,18)
        description: Stream open minus official open; null when a side is missing.
      - name: high_delta
        data_type: decimal(38,18)
        description: Stream high minus official high.
      - name: low_delta
        data_type: decimal(38,18)
        description: Stream low minus official low.
      - name: close_delta
        data_type: decimal(38,18)
        description: Stream close minus official close.
      - name: volume_delta_pct
        data_type: double
        description: (stream volume - official volume) / official volume * 100.
      - name: stream_trade_count
        data_type: bigint
        description: Trades in the stream candle; null when the stream has no candle.
      - name: first_reconciled_at
        data_type: timestamp
        description: When the minute was first reconciled.
      - name: last_reconciled_at
        data_type: timestamp
        description: When the minute was last reconciled.

  - name: mart_completeness_hourly
    description: >-
      Raw vs repaired completeness and match rate per product-hour (PRD §2, ADR-012).
      Completeness counts MATCH and OFFICIAL_MISMATCH minutes; match rate counts MATCH.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, hour_ts]
    columns:
      - name: product_id
        data_type: string
        description: Coinbase product, e.g. BTC-USD.
        constraints:
          - type: not_null
      - name: hour_ts
        data_type: timestamp
        description: Start of the hour (UTC).
        constraints:
          - type: not_null
      - name: minutes
        data_type: bigint
        description: Reconciled minutes in the hour.
      - name: complete_minutes_before
        data_type: bigint
        description: MATCH or OFFICIAL_MISMATCH before repair.
      - name: complete_minutes_after
        data_type: bigint
        description: MATCH or OFFICIAL_MISMATCH after repair.
      - name: match_minutes
        data_type: bigint
        description: MATCH after repair.
      - name: official_mismatch_minutes
        data_type: bigint
        description: OFFICIAL_MISMATCH after repair (Coinbase's candle disagrees with its trades).
      - name: raw_completeness_pct
        data_type: double
        description: complete_minutes_before / minutes * 100.
      - name: repaired_completeness_pct
        data_type: double
        description: complete_minutes_after / minutes * 100.
      - name: match_rate_pct
        data_type: double
        description: match_minutes / minutes * 100.
      - name: last_reconciled_at
        data_type: timestamp
        description: Latest reconciliation of any minute in the hour.

  - name: mart_market_daily
    description: >-
      Daily market view per product and complete UTC day (PRD §4, §7): OHLC, VWAP,
      volume, notional, trade count and realized volatility, from every known trade
      (stream + backfill, deduplicated). minutes_with_trades below 1,440 marks partial
      days (for example before capture started).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, day]
    columns:
      - name: product_id
        data_type: string
        description: Coinbase product, e.g. BTC-USD.
        constraints:
          - type: not_null
      - name: day
        data_type: date
        description: UTC day.
        constraints:
          - type: not_null
      - name: open
        data_type: decimal(38,18)
        description: Price of the day's lowest trade id.
      - name: high
        data_type: decimal(38,18)
        description: Highest trade price of the day.
      - name: low
        data_type: decimal(38,18)
        description: Lowest trade price of the day.
      - name: close
        data_type: decimal(38,18)
        description: Price of the day's highest trade id.
      - name: vwap
        data_type: decimal(38,8)
        description: Volume-weighted average price, sum(price * size) / sum(size).
      - name: volume
        data_type: decimal(38,18)
        description: Sum of trade sizes (base currency).
      - name: notional_usd
        data_type: decimal(38,8)
        description: Sum of price * size (quote currency, USD).
      - name: trade_count
        data_type: bigint
        description: Number of distinct trades.
      - name: minutes_with_trades
        data_type: bigint
        description: Minutes of the day with at least one trade (1,440 at most).
      - name: realized_vol_pct
        data_type: double
        description: Std dev of 1-minute log returns of candle closes x sqrt(1440) x 100.
