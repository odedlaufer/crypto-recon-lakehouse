name: crypto_recon
version: "0.1.0"
profile: crypto_recon

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # FR-R1: only minutes older than this are reconciled.
  settlement_minutes: 15
  # FR-R3 / FR-R5: MATCH allows a relative volume difference up to this percentage.
  volume_tolerance_pct: 0.01
  # First day reconciled; earlier official candles are history without stream data.
  reconcile_start_date: "2026-11-10"
  # Incremental runs re-reconcile this many recent days, so repairs (Phase 3) and late
  # official corrections update status_after_repair.
  reconcile_lookback_days: 3
  # Gap detection (FR-J2, ADR-013) scans this many recent days of silver.trades.
  gap_lookback_days: 3
  # PRD §2 / ADR-012: repaired completeness SLO per product-day, and how many recent
  # days the alert checks.
  completeness_slo_pct: 99.9
  completeness_alert_days: 3
  # mart_market_daily: incremental runs recompute this many recent days (repairs land late).
  market_lookback_days: 3
  # ops.pipeline_runs: count only jobs named crypto-recon-*-<bundle_target>.
  bundle_target: dev

models:
  crypto_recon:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
    ops:
      +schema: ops
  # Elementary (FR-O5): artifacts, run results and anomaly metrics in their own schema.
  elementary:
    +schema: elementary
