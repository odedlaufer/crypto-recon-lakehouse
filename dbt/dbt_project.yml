name: crypto_recon
version: "0.1.0"
profile: crypto_recon

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # FR-R1: only minutes older than this are reconciled.
  settlement_minutes: 15
  # FR-R3 / FR-R5: MATCH allows a relative volume difference up to this percentage.
  volume_tolerance_pct: 0.01
  # First day reconciled; earlier official candles are history without stream data.
  reconcile_start_date: "2026-11-10"
  # Incremental runs re-reconcile this many recent days, so repairs (Phase 3) and late
  # official corrections update status_after_repair.
  reconcile_lookback_days: 3

models:
  crypto_recon:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
