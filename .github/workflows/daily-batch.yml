name: daily-batch

# Daily orchestration (ADR-010), the full repair loop of Phase 3:
#   1. fetch the last 2 days of official candles (yesterday plus a re-fetch for Q5)
#   2. Databricks daily job: candles write-audit-publish + stream pipeline refresh
#   3. dbt build: reconcile; first verdict of new minutes = status_before_repair
#   4. backfill the trades of open gaps from REST (FR-B4)
#   5. stream pipeline refresh: load the backfilled trades (ADR-014)
#   6. dbt build: gaps repaired, status_after_repair updated (FR-J3)

on:
  schedule:
    - cron: "37 0 * * *" # 00:37 UTC: yesterday is complete; off the busy top of hour
  workflow_dispatch:
    inputs:
      date:
        description: Last UTC day to process (YYYY-MM-DD); the day before is re-fetched too. Empty means yesterday.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: 8330a90a8089093e # dev SQL warehouse (not a secret)
      VOLUME_PATH: /Volumes/crypto_dev/raw/landing
    steps:
      - name: Resolve date range
        id: range
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          END="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          if ! [[ "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid date: $END"; exit 1
          fi
          START="$(date -u -d "$END - 1 day" +%F)"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Processing $START to $END"

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - uses: databricks/setup-cli@main
        with:
          version: 1.25.0

      - name: Install
        run: |
          uv sync --frozen --all-packages --group dbt
          cd dbt && uv run --no-sync dbt deps

      - name: 1. Fetch official candles
        run: |
          uv run --no-sync python -m crypto_recon_fetchers candles \
            --start "${{ steps.range.outputs.start }}" --end "${{ steps.range.outputs.end }}" \
            --volume-path "$VOLUME_PATH"

      - name: 2. Databricks daily job (candles WAP + stream refresh)
        run: |
          databricks bundle run daily -t dev \
            --params "start_date=${{ steps.range.outputs.start }},end_date=${{ steps.range.outputs.end }}"

      - name: 3. dbt build (reconcile; raw verdict)
        working-directory: dbt
        run: uv run --no-sync dbt build --target ci_dev --exclude tag:post_repair

      - name: 4. Backfill open gaps from REST
        id: backfill
        continue-on-error: true # a failed gap must not block loading the others
        run: |
          uv run --no-sync python -m crypto_recon_fetchers backfill \
            --catalog crypto_dev --volume-path "$VOLUME_PATH"

      - name: 5. Stream pipeline refresh (load backfilled trades)
        run: databricks bundle run stream -t dev

      - name: 6. dbt build (repaired verdict)
        working-directory: dbt
        run: uv run --no-sync dbt build --target ci_dev

      - name: 7. dbt source freshness (DQ-10, FR-D4)
        if: ${{ !cancelled() }}
        working-directory: dbt
        run: uv run --no-sync dbt source freshness --target ci_dev

      - name: 8. Elementary report and anomaly alerts (FR-O5)
        if: ${{ !cancelled() }}
        continue-on-error: true # observability must not fail the batch
        working-directory: dbt
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          uv run --no-sync edr monitor --profiles-dir . --project-dir . --profile-target ci_dev --slack-webhook "$SLACK_WEBHOOK_URL"
          uv run --no-sync edr report --profiles-dir . --project-dir . --profile-target ci_dev --file-path edr_report.html

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/target/sources.json
            dbt/edr_report.html
            dbt/edr_target/edr.log
            dbt/logs/dbt.log
          retention-days: 14

      - name: Fail if the backfill failed
        if: steps.backfill.outcome == 'failure'
        run: |
          echo "::error::backfill reported failed gaps or uploads; see step 4"
          exit 1

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          uv run --no-sync python -m crypto_recon_common.notify --level error \
            "daily-batch failed for ${{ steps.range.outputs.start }} to ${{ steps.range.outputs.end }}"
