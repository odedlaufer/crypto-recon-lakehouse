name: daily-batch

# Daily orchestration (ADR-010): fetch the last 2 days of official candles (yesterday plus a
# re-fetch of the day before, so late corrections are picked up and Q5 can be measured),
# run the Databricks daily job (candles WAP + stream refresh), then reconcile with dbt.

on:
  schedule:
    - cron: "37 0 * * *" # 00:37 UTC: yesterday is complete; off the busy top of hour
  workflow_dispatch:
    inputs:
      date:
        description: Last UTC day to process (YYYY-MM-DD); the day before is re-fetched too. Empty means yesterday.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 60
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      VOLUME_PATH: /Volumes/crypto_dev/raw/landing
    steps:
      - name: Resolve date range
        id: range
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          END="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          if ! [[ "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid date: $END"; exit 1
          fi
          START="$(date -u -d "$END - 1 day" +%F)"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Processing $START to $END"

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - uses: databricks/setup-cli@main
        with:
          version: 1.25.0

      - name: Install
        run: uv sync --frozen --all-packages --group dbt

      - name: Fetch official candles
        run: |
          uv run --no-sync python -m crypto_recon_fetchers candles \
            --start "${{ steps.range.outputs.start }}" --end "${{ steps.range.outputs.end }}" \
            --volume-path "$VOLUME_PATH"

      - name: Databricks daily job (candles WAP + stream refresh)
        run: |
          databricks bundle run daily -t dev \
            --params "start_date=${{ steps.range.outputs.start }},end_date=${{ steps.range.outputs.end }}"

      - name: dbt build (reconciliation)
        working-directory: dbt
        run: |
          uv run --no-sync dbt deps
          uv run --no-sync dbt build --target ci_dev

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/logs/dbt.log
          retention-days: 14
