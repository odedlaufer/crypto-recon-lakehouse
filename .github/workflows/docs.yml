name: docs

# Publishes dbt docs and the Elementary report to GitHub Pages after each daily-batch run
# (PRD §8.3, FR-D5, FR-O5). Site: https://odedlaufer.github.io/crypto-recon-lakehouse/

on:
  workflow_run:
    workflows: [daily-batch]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev # Databricks token for dbt docs and edr
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --frozen --all-packages --group dbt
          cd dbt && uv run --no-sync dbt deps

      - name: dbt docs (single self-contained page)
        working-directory: dbt
        run: uv run --no-sync dbt docs generate --static --target ci_dev

      - name: Elementary report
        working-directory: dbt
        run: |
          uv run --no-sync edr report --profiles-dir . --project-dir . --profile-target ci_dev \
            --file-path edr_report.html

      - name: Export live numbers for the site
        env:
          DATABRICKS_WAREHOUSE_ID: 8330a90a8089093e
        run: uv run --no-sync python scripts/export_site_data.py --out site/data

      - name: Assemble site
        run: |
          mkdir -p site/dbt site/elementary
          cp -r web/. site/
          cp dbt/target/static_index.html site/dbt/index.html
          cp dbt/edr_report.html site/elementary/index.html
          ls -R site | head -30

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
